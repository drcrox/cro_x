<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cro_x Pool Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: pool list on the left with progress, one shuffled pool at a time on the right. Ember red on parchment/charcoal. */
:root{--bg:#f3ede0;--panel:#fbf7ee;--ink:#2a2118;--mute:#6f6354;--line:#d9ceb8;--accent:#a3201a;--accent-ink:#fff;--keep:#2f6b3a;--cut:#8a2a22;--edit:#8a6414;--chip:#ebe2cf;
--display:'Cinzel',Georgia,serif;--body:'IBM Plex Sans',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--panel:#201a14;--ink:#eadfca;--mute:#a09280;--line:#3a3025;--accent:#d8473b;--accent-ink:#17130f;--keep:#7cc48a;--cut:#e0786d;--edit:#e0b254;--chip:#2c241b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130f;--panel:#201a14;--ink:#eadfca;--mute:#a09280;--line:#3a3025;--accent:#d8473b;--accent-ink:#17130f;--keep:#7cc48a;--cut:#e0786d;--edit:#e0b254;--chip:#2c241b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
button,input,textarea,select{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
h1{font:600 20px var(--display);letter-spacing:.04em;margin:0}
.total{display:flex;align-items:center;gap:10px;color:var(--mute);font-variant-numeric:tabular-nums}
.bar{width:160px;height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{display:grid;grid-template-columns:300px 1fr;gap:0;align-items:start}
nav{border-right:1px solid var(--line);padding:12px 8px 40px;position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto}
nav h2{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:14px 10px 4px}
nav button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:14px}
nav button:hover{background:var(--chip)}
nav button[aria-current="true"]{background:var(--chip);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
nav .n{color:var(--mute);font-variant-numeric:tabular-nums}
nav .done .n{color:var(--keep)}
main{padding:20px 24px 80px;max-width:820px}
.crumb{color:var(--mute);font-size:13px;margin-bottom:2px}
h3{font:600 22px var(--display);margin:0 0 6px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 10px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.help{color:var(--mute);font-size:13px}
.line{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:10px 14px;margin:0 0 8px}
.line.k{border-left-color:var(--keep)}.line.x{border-left-color:var(--cut)}.line.e{border-left-color:var(--edit)}
.line.cur{box-shadow:0 0 0 2px var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-start}
.txt{flex:1 1 300px;font-size:16px;overflow-wrap:anywhere}
.txt.emote{font-style:italic}
.txt.cut{text-decoration:line-through;color:var(--mute)}
.acts{display:flex;gap:6px}
.acts button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 10px;cursor:pointer;min-width:64px}
.acts button[aria-pressed="true"].k{background:var(--keep);color:var(--bg);border-color:var(--keep)}
.acts button[aria-pressed="true"].x{background:var(--cut);color:var(--bg);border-color:var(--cut)}
.acts button[aria-pressed="true"].e{background:var(--edit);color:var(--bg);border-color:var(--edit)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--mute)}
.chip.t{color:var(--accent);font-weight:600}
.rate{font-variant-numeric:tabular-nums}
textarea.rw{width:100%;margin-top:8px;min-height:54px;padding:8px;border:1px solid var(--edit);border-radius:6px;background:var(--bg)}
.note{width:100%;margin-top:8px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.empty{color:var(--mute);padding:30px 0}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);width:min(760px,92vw);padding:18px}
dialog textarea{width:100%;height:50vh;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace}
dialog::backdrop{background:rgba(0,0,0,.5)}
.status{font-size:13px;color:var(--mute)}
@media (max-width:760px){.wrap{grid-template-columns:1fr}nav{position:static;height:auto;max-height:220px;border-right:0;border-bottom:1px solid var(--line)}main{padding:16px}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s}}
</style>
</head>
<body>
<header>
  <h1>cro_x Pool Audit</h1>
  <div class="total"><div class="bar" aria-hidden="true"><i id="gbar" style="width:0"></i></div><span id="gtxt"></span></div>

</header>
<div class="wrap">
  <nav id="nav" aria-label="Pools"></nav>
  <main id="main"></main>
</div>
<dialog id="dlg">

  <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end">
    <button class="btn primary" id="copy" type="button">Copy</button>
    <button class="btn" id="close" type="button">Close</button>
  </div>
</dialog>

oday's a good day for it!","r":1,"o":"cheerful","a":["kill"]},{"t":"Coins don't care whose pocket they rot in!","r":5,"o":"grim","a":["kill"]},{"t":"Worth every copper they pay me!","r":2,"o":"cocky","a":["finisher","heavy"]},{"t":"Business, nothing more.","r":3,"o":"calm","a":["opener","finisher"]},{"t":"You're cutting into my damn PROFITS!","r":3,"o":"hot-headed","c":"You're cutting into my PROFITS!","a":["guard"],"m":["hurt"]}]},{"id":"prof:alchemy","group":"Professions (combat)","name":"Alchemy","lines":[{"t":"My own brew!","r":2,"a":["item:potion","item:healing","item:mana","item:rage","item:elixir","item:flask"],"m":["recipe"]},{"t":"Mixed it myself - should be fine!","r":2,"a":["item:potion","item:healing","item:mana","item:rage","item:elixir","item:flask"],"m":["recipe"]},{"t":"Tastes awful - works great!","r":3,"o":"gruff","a":["item:potion","item:healing","item:mana","item:rage","item:elixir","item:flask"]},{"t":"Bottoms up - fresh from my lab!","r":1,"o":"cheerful","a":["item:potion","item:healing","item:mana","item:rage","item:elixir","item:flask"],"m":["recipe"]},{"t":"One drop off and this would kill me... cheers!","r":5,"o":"grim","a":["item:potion","item:healing","item:mana","item:rage","item:elixir","item:flask"]},{"t":"Perfect recipe, as always!","r":2,"o":"cocky","a":["item:potion","item:healing","item:mana","item:rage","item:elixir","item:flask"],"m":["recipe"]},{"t":"Measured to the drop.","r":2,"o":"calm","a":["item:potion","item:healing","item:mana","item:rage","item:elixir","item:flask"]},{"t":"DRINK UP AND BURN!","r":3,"o":"hot-headed","a":["item:rage"]}]},{"id":"class:DRUID","group":"Class","name":"Druid","lines":[{"t":"Nature's fury!","r":2,"a":["heavy"]},{"t":"Cenarius, guide me!","r":2,"a":["heal"]},{"t":"Let nature mend you!","r":2,"a":["heal"],"m":["ally"]},{"t":"The wild answers!","r":3,"a":["powerup"]},{"t":"Claws or roots - your pick!","r":3,"o":"gruff","a":["lockdown"]},{"t":"Nature always wins in the end!","r":1,"o":"cheerful","a" "r":4,"o":"hot-headed","a":["laststand","powerup"]}]},{"id":"prof:tailoring","group":"Professions (combat)","name":"Tailoring","lines":[{"t":"Pinned and hemmed!","r":2,"a":["lockdown"]},{"t":"Don't tear the robes!","r":2,"a":["guard"],"m":["hurt"]},{"t":"This cloth's tougher than it looks - so am I!","r":3,"o":"gruff","a":["guard"]},{"t":"Stitched it myself - isn't it lovely!","r":1,"o":"cheerful","a":["powerup"],"m":["recipe:armor"]},{"t":"Sewing shrouds is good practice!","r":5,"o":"grim","a":["finisher"]},{"t":"Tailored for winning!","r":2,"o":"cocky","a":["powerup"]},{"t":"One stitch at a time.","r":2,"o":"calm","a":["upkeep"]},{"t":"You'll pay for that TEAR!","r":4,"o":"hot-headed","a":["guard"],"m":["hurt"]}]},{"id":"home:stratholme","group":"Homeland","name":"Stratholme","lines":[{"t":"I survived Stratholme... in a manner of speaking!","r":4,"a":["laststand"]},{"t":"Remember Stratholme!","r":4,"a":["opener","powerup"]},{"t":"Arthas culled my city - you won't cull me!","r":5,"a":["guard"]},{"t":"Fire and plague - that was my home!","r":4,"a":["area"]},{"t":"Stratholme was hell, and I'm still here!","r":4,"o":"gruff","c":"Stratholme burned around me, and I'm still here!","a":["guard"],"m":["hurt"]},{"t":"Nothing scares me after Stratholme - nothing!","r":2,"o":"cheerful","a":["opener"]},{"t":"I was culled once... I don't plan on twice!","r":5,"o":"grim","a":["laststand"]},{"t":"Arthas couldn't finish me - and you're no prince!","r":3,"o":"cocky","a":["taunt"]},{"t":"I remember the smoke... I remember everything.","r":5,"o":"calm","a":["upkeep","powerup"]},{"t":"STRATHOLME BURNS IN ME!","r":5,"o":"hot-headed","a":["powerup","area"]}]},{"id":"prof:cooking","group":"Professions (combat)","name":"Cooking","lines":[{"t":"My own recipe!","r":1,"a":["item:food"],"m":["recipe"]},{"t":"Nothing beats a home-cooked meal!","r":1,"a":["item:food"],"m":["recipe"]},{"t":"Eat, then fight!","r":2,"o":"gruff","a":["item:food"]},{"t":"Chef's special!","r":1,"o":"cheerful","a":["item:food"],"m":["recipe"]},{"t":"If it's my last meal, it may as well be a good one!","r":4,"o":"grim","a":["item:food"]},{"t":"Best cook in the Horde, no contest!","r":2,"o":"cocky","a":["item:food"],"m":["recipe"]},{"t":"A good meal settles everything.","r":1,"o":"calm","a":["item:food"]},{"t":"I COOKED IT, SO I'M EATING IT!","r":2,"o":"hot-headed","a":["item:food"],"m":["recipe"]}]},{"id":"prof:enchanting","group":"Professions (combat)","name":"Enchanting","lines":[{"t":"Feel the enchantment!","r":2,"a":["heavy"],"m":["enchanted"]},{"t":"Runes don't lie!","r":2,"a":["guard"]},{"t":"Dust enough trinkets and you learn things!","r":3,"o":"gruff","a":["kill"]},{"t":"Ooh, sparkly!","r":1,"o":"cheerful","a":["heavy"],"m":["enchanted"]},{"t":"Everything can be disenchanted - even you!","r":5,"o":"grim","a":["finisher"]},{"t":"Best enchantment money can buy!","r":2,"o":"cocky","a":["heavy"],"m":["enchanted"]},{"t":"The runes are steady.","r":2,"o":"calm","a":["guard"]},{"t":"I'll turn you to DUST!","r":4,"o":"hot-headed","a":["finisher"]}]},{"id":"home:the_barrens","group":"Homeland","name":"The Barrens","lines":[{"t":"Barrens-born, Barrens-tough!","r":2,"a":["guard"]},{"t":"I've crossed the Barrens on foot - this is nothing!","r":3,"a":["filler"]},{"t":"The Barrens taught me to keep moving!","r":2,"a":["escape"]},{"t":"Even the Barrens grass is tougher than you!","r":2,"a":["taunt"]},{"t":"Thirst and dust - I was raised on both!","r":4,"o":"gruff","a":["guard"],"m":["hurt"]},{"t":"Nothing beats a good brawl on the open plains!","r":1,"o":"cheerful","a":["opener"]},{"t":"The vultures always know before you do!","r":5,"o":"grim","a":["finisher"]},{"t":"I've outrun Barrens raptors - you're slow!","r":3,"o":"cocky","a":["escape","snare"]},{"t":"Wide skies, steady hands.","r":2,"o":"calm","a":["heavy"]},{"t":"I'll leave you for the HYENAS!","r":4,"o":"hot-headed","a":["finisher"]}]},{"id":"home:tirisfal_brill","group":"Homeland","name":"Tirisfal Brill","lines":[{"t":"For Brill!","r":2,"a":["opener"]},{"t":"Tirisfal's soil won't keep me down!","r":4,"a":["laststand"]},{"t":"The Scarlet zealots couldn't stop me!","r":3,"a":["guard"]},{"t":"Pumpkins and graves - that's home!","r":2,"a":["kill"]},{"t":"I clawed my way out of a Tirisfal grave - you're nothing!","r":5,"o":"gruff","a":["opener"]},{"t":"Brill's lovely this time of year - all fog and crows!","r":2,"o":"cheerful","a":["filler"]},{"t":"Tirisfal is full of fresh graves... make room!","r":5,"o":"grim","a":["finisher"]},{"t":"Woke up dead in Deathknell and still came out on top!","r":3,"o":"cocky","a":["kill"]},{"t":"Fog, silence... and then you.","r":4,"o":"calm","a":["sneak","opener"]},{"t":"TIRISFAL TAKES YOU!","r":5,"o":"hot-headed","a":["heavy"]}]},{"id":"up:outlaw","group":"Upbringing","name":"Outlaw","lines":[{"t":"I've slipped out of tighter spots than this!","r":2,"a":["escape"]},{"t":"Nobody's watching... good!","r":3,"a":["sneak","opener"],"m":["stealth"]},{"t":"Check the pockets!","r":2,"a":["kill"]},{"t":"Dirty fighting is still fighting!","r":3,"a":["lockdown","weaken","snare"]},{"t":"Grew up on the wrong side of everything!","r":4,"o":"gruff","a":["filler"]},{"t":"Run, little rabbit... oh, you can't!","r":2,"o":"cheerful","a":["snare"]},{"t":"Every grave I passed had someone I knew in it!","r":5,"o":"grim","a":["kill","laststand"]},{"t":"Catch me if you can - you can't!","r":3,"o":"cocky","a":["escape"]},{"t":"Quiet hands, quiet feet.","r":3,"o":"calm","a":["sneak"]},{"t":"Nobody puts ME in chains!","r":4,"o":"hot-headed","a":["escape"]}]},{"id":"home:windsong_lake","group":"Homeland","name":"Windsong Lake","lines":[{"t":"The lake sang me to sleep - now I'll sing you to yours!","r":3,"a":["lockdown","finisher"]},{"t":"Calm as Windsong water!","r":2,"a":["heal","guard"]}]},{"id":"home:andorhal","group":"Homeland","name":"Andorhal","lines":[{"t":"For Andorhal!","r":2,"a":["opener"]},{"t":"Plagued grain couldn't finish me!","r":4,"a":["guard","debuff:diseased"]},{"t":"Andorhal was only the beginning!","r":4,"a":["powerup"]},{"t":"I got the first taste of the plague - you get the last!","r":5,"a":["finisher"]},{"t":"I ate the grain and lived - more or less!","r":4,"o":"gruff","a":["guard"],"m":["hurt"]},{"t":"Plague, death, and still smiling - try harder!","r":2,"o":"cheerful","a":["heavy"]},{"t":"A whole town went into the ground... I came back up!","r":5,"o":"grim","a":["powerup"]},{"t":"Survived the plague, and you think YOU'RE a threat?!","r":3,"o":"cocky","a":["taunt"]},{"t":"Everything rots in time.","r":4,"o":"calm","a":["upkeep","weaken"]},{"t":"THEY POISONED MY HOME!","r":5,"o":"hot-headed","a":["powerup"]}]},{"id":"prof:fishing","group":"Professions (combat)","name":"Fishing","lines":[{"t":"Nothing beats fresh fish!","r":1,"a":["item:food"],"m":["fish"]}]},{"id":"up:soldier","group":"Upbringing","name":"Soldier","lines":[{"t":"Form up!","r":2,"a":["rally"],"m":["group"]},{"t":"Just like the drills!","r":2,"a":["filler"]},{"t":"Hold formation!","r":2,"a":["rally","guard"],"m":["group"]},{"t":"Enemy down - next!","r":3,"a":["kill"]},{"t":"Seen worse in training!","r":3,"o":"gruff","a":["guard"],"m":["hurt"]},{"t":"The sergeant would be proud of this one!","r":1,"o":"cheerful","a":["heavy","kill"]},{"t":"I buried half my company... you won't be the one who buries me!","r":5,"o":"grim","a":["laststand"]},{"t":"Top of my unit, and it shows!","r":3,"o":"cocky","a":["finisher"]},{"t":"Discipline holds when courage doesn't.","r":3,"o":"calm","a":["guard","laststand"]},{"t":"CHARGE!","r":3,"o":"hot-headed","a":["opener"]}]},{"id":"home:stonespire_lands","group":"Homeland","name":"Stonespire Lands","lines":[{"t":"For the Stonespire!","r":2,"a":["opener"]},{"t":"The dwarves call it Bael Modan - I call it home!","r":3,"a":["opener"]},{"t":"Hard as the hills I was born in!","r":2,"a":["guard"]},{"t":"The Earth Mother's land will be whole again!","r":3,"a":["powerup"]},{"t":"My people's land was all rock and wind - and so am I!","r":3,"o":"gruff","a":["guard"]},{"t":"Home's a hard place, and I loved every rock of it!","r":1,"o":"cheerful","a":["filler"]},{"t":"Stonespire dust has buried bigger things than you!","r":5,"o":"grim","a":["finisher"]},{"t":"The Bael'dun dwarves fought better than this!","r":3,"o":"cocky","a":["taunt"]},{"t":"Stone endures.","r":2,"o":"calm","a":["guard","laststand"]},{"t":"THE EARTH ITSELF WANTS YOU GONE!","r":4,"o":"hot-headed","a":["area","heavy"]},{"t":"You dug up our sacred ground - now I'll bury you in it!","r":5,"a":["opener"],"m":["allianceplayer","erace:Dwarf"]}]},{"id":"drive:duty","group":"Drive","name":"Duty","lines":[{"t":"The Horde asks, I answer!","r":2,"a":["opener","rally"]},{"t":"My orders were clear!","r":3,"a":["opener","finisher"]},{"t":"Duty done... on to the next!","r":2,"a":["kill"]},{"t":"I hold this line!","r":3,"a":["guard","taunt","laststand"]},{"t":"Not my choice - my job!","r":3,"o":"gruff","a":["opener","filler"]},{"t":"Happy to serve - happier to win!","r":1,"o":"cheerful","a":["kill"]},{"t":"Someone has to stand here... it may as well be me!","r":5,"o":"grim","a":["laststand","guard"]},{"t":"The Horde sent its best - lucky you!","r":3,"o":"cocky","a":["opener"]},{"t":"You stand between me and my task.","r":3,"o":"calm","a":["opener"]},{"t":"No one gets past me - NO ONE!","r":4,"o":"hot-headed","a":["taunt","guard"]}]},{"id":"prof:blacksmithing","group":"Professions (combat)","name":"Blacksmithing","lines":[{"t":"Forged this myself!","r":2,"a":["heavy"],"m":["recipe:weapon"]},{"t":"Good steel holds!","r":2,"a":["guard"],"m":["hurt"]},{"t":"Hammered this edge for a week - feel it!","r":3,"o":"gruff","a":["heavy"],"m":["recipe:weapon"]},{"t":"Love it when my work does the talking!","r":1,"o":"cheerful","a":["heavy"],"m":["recipe:weapon"]},{"t":"Every blade I make ends up in someone!","r":5,"o":"grim","a":["heavy"]},{"t":"My armor, my rules!","r":2,"o":"cocky","a":["guard"],"m":["hurt"]},{"t":"Well tempered, well balanced.","r":2,"o":"calm","a":["filler"]},{"t":"I'll REFORGE you!","r":4,"o":"hot-headed","a":["heavy"]}]},{"id":"prof:leatherworking","group":"Professions (combat)","name":"Leatherworking","lines":[{"t":"Good leather on that one!","r":2,"a":["kill"],"m":["beast"]},{"t":"This armor's my own work!","r":2,"a":["guard"],"m":["hurt","recipe:armor"]},{"t":"Don't scratch the hide!","r":3,"o":"gruff","a":["filler"],"m":["beast"]},{"t":"Ooh, new boots!","r":1,"o":"cheerful","a":["kill"],"m":["beast"]},{"t":"I'll wear you well!","r":5,"o":"grim","a":["kill"],"m":["beast"]},{"t":"I've tanned tougher hides than yours!","r":3,"o":"cocky","a":["taunt"],"m":["beast"]},{"t":"Careful... don't ruin the hide.","r":2,"o":"calm","a":["finisher"],"m":["beast"]},{"t":"I'll make a SADDLE out of you!","r":4,"o":"hot-headed","a":["heavy"],"m":["beast"]}]},{"id":"prof:first_aid","group":"Professions (combat)","name":"First Aid","lines":[{"t":"Wrap it tight!","r":2,"a":["item:bandage"]},{"t":"Bandaged and back!","r":2,"a":["item:bandage"]},{"t":"Just a scratch - wrap it and go!","r":3,"o":"gruff","a":["item:bandage"]},{"t":"Good as new... nearly!","r":1,"o":"cheerful","a":["item:bandage"]},{"t":"Not the first wound I've stitched shut!","r":4,"o":"grim","a":["item:bandage"]},{"t":"Patched up like a pro!","r":2,"o":"cocky","a":["item:bandage"]},{"t":"Pressure, then wrap.","r":2,"o":"calm","a":["item:bandage"]},{"t":"STOP BLEEDING, DAMN IT!","r":3,"o":"hot-headed","c":"STOP BLEEDING ALREADY!","a":["item:bandage"]}]},{"id":"home:thousand_needles","group":"Homeland","name":"Thousand Needles","lines":[{"t":"For the Needles!","r":2,"a":["opener"]},{"t":"I grew up among the pillars - I don't fall easy!","r":3,"a":["laststand"]},{"t":"Steady as the stone pillars!","r":2,"a":["guard"]},{"t":"Centaur raids taught me young!","r":3,"a":["reactive","interrupt"]},{"t":"The Galak never broke me, and neither will you!","r":4,"o":"gruff","a":["guard"]},{"t":"Feels like the Shimmering Flats races all over again!","r":1,"o":"cheerful","a" const KEY = "croxAudit1";
let D = {}, cur = POOLS[0].id, filter = "all", focus = 0, db = null, doc = null, saveTimer = null;

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function shuffled(p){ // stable shuffle per pool so the order never changes between visits
  const idx=p.lines.map((_,i)=>i); let s=hash(p.id)||1;
  for(let i=idx.length-1;i>0;i--){s=Math.imul(s,1664525)+1013904223>>>0;const j=s%(i+1);[idx[i],idx[j]]=[idx[j],idx[i]]}
  return idx;
}
POOLS.forEach(p=>p.order=shuffled(p));
const byId=Object.fromEntries(POOLS.map(p=>[p.id,p]));
const keyOf=(pid,i)=>pid+"|"+i;
function stat(p){let k=0,x=0,e=0;p.lines.forEach((_,i)=>{const d=D[keyOf(p.id,i)];if(d){if(d.s==="k")k++;else if(d.s==="x")x++;else if(d.s==="e")e++}});return {k,x,e,done:k+x+e,n:p.lines.length}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    if(doc){try{await doc.set({d:D,t:Date.now()});setSave("Saved")}catch(e){setSave("Saved in this browser only")}}
    else setSave("Saved in this browser only");
  },600);
}
function setSave(t){document.getElementById("save").textContent=t}

function renderNav(){
  const nav=document.getElementById("nav");let html="",g="";
  POOLS.forEach(p=>{
    if(p.group!==g){g=p.group;html+=`<h2>${esc(g)}</h2>`}
    const s=stat(p);
    html+=`<button type="button" data-id="${esc(p.id)}" class="${s.done===s.n?"done":""}" ${p.id===cur?'aria-current="true"':""}><span>${esc(p.name)}</span><span class="n">${s.done}/${s.n}</span></button>`;
  });
  nav.innerHTML=html;
  let T=0,Dn=0;POOLS.forEach(p=>{const s=stat(p);T+=s.n;Dn+=s.done});
  document.getElementById("gbar").style.width=(100*Dn/T)+"%";
  document.getElementById("gtxt").textContent=`${Dn} of ${T} lines decided`;
}
function chips(l){
  let c="";
  if(l.o)c+=`<span class="chip t">${esc(l.o)} only</span>`;
  if(l.e)c+=`<span class="chip">emote</span>`;
  if(l.r)c+=`<span class="chip rate" title="Darkness, 1 light to 5 dark">dark ${l.r}/5</span>`;
  if(l.a)c+=`<span class="chip">fits: ${esc(l.a.join(", "))}</span>`;
  if(l.m)c+=`<span class="chip">needs: ${esc(l.m.join(", "))}</span>`;
  if(l.c)c+=`<span class="chip">clean: ${esc(l.c)}</span>`;
  return c;
}
function renderMain(){
  const p=byId[cur],m=document.getElementById("main"),s=stat(p);
  const items=p.order.filter(i=>{const d=D[keyOf(p.id,i)];const st=d?d.s:"";return filter==="all"||(filter==="u"&&!st)||filter===st});
  if(focus>=items.length)focus=Math.max(0,items.length-1);
  let h=`<div class="crumb">${esc(p.group)}</div><h3>${esc(p.name)}</h3>
  <div class="help">${s.n} lines, shuffled. Kept ${s.k}, cut ${s.x}, rewrite ${s.e}, undecided ${s.n-s.done}.</div>
  <div class="tools"><div class="seg" role="group" aria-label="Filter">
    ${[["all","All"],["u","Undecided"],["k","Kept"],["x","Cut"],["e","Rewrite"]].map(([v,t])=>`<button type="button" data-f="${v}" aria-pressed="${filter===v}">${t}</button>`).join("")}
  </div><span class="help">Keys: K keep, X cut, E rewrite, arrows to move.</span></div>`;
  if(!items.length)h+=`<div class="empty">Nothing here with this filter.</div>`;
  items.forEach((i,n)=>{
    const l=p.lines[i],d=D[keyOf(p.id,i)]||{},st=d.s||"";
    h+=`<div class="line ${st} ${n===focus?"cur":""}" data-i="${i}" data-n="${n}">

      <div class="acts">

        <button type="button" class="x" data-a="x" aria-pressed="${st==="x"}">Cut</button>

      ${st?`<input class="note" id="nt-${i}" aria-label="Note" placeholder="Optional note (why)" value="${esc(d.n||"")}">`:""}
    </div>`;
  });

function setDecision(i,a){

  if(key==="arrowdown"||key==="j"){focus=Math.min(rows.length-1,focus+1)}
  else if(key==="arrowup"){focus=Math.max(0,focus-1)}
  else if(["k","x","e"].includes(key)){const r=rows[focus];if(r){const wasFocus=focus;setDecision(+r.dataset.i,key);
      if(key!=="e"&&filter==="all")focus=Math.min(wasFocus+1,rows.length-1);renderMain();const c=document.querySelector("#main .line.cur");if(c)c.scrollIntoView({block:"center"});
      if(key==="e"){const rw=document.getElementById("rw-"+r.dataset.i);if(rw)rw.focus()}}return}
  else return;
  e.preventDefault();renderMain();const c=document.querySelector("#main .line.cur");if(c)c.scrollIntoView({block:"center"});
});
document.getElementById("theme").onclick=()=>{
  const r=document.documentElement,dark=(r.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"))==="dark";
  r.dataset.theme=dark?"light":"dark";
};
function exportText(){
  const out=["cro_x pool audit choices"];let T=0,Dn=0;
  POOLS.forEach(p=>{
    const s=stat(p);T+=s.n;Dn+=s.done;if(!s.done)return;
    out.push("","## "+p.group+" / "+p.name+" (kept "+s.k+", cut "+s.x+", rewrite "+s.e+", undecided "+(s.n-s.done)+")");
    p.lines.forEach((l,i)=>{const d=D[keyOf(p.id,i)];if(!d)return;
      const tag=l.o?" ["+l.o+"]":"";
      if(d.s==="k")out.push("KEEP"+tag+": "+l.t+(d.n?"  // "+d.n:""));
      else if(d.s==="x")out.push("CUT"+tag+": "+l.t+(d.n?"  // "+d.n:""));
      else out.push("REWRITE"+tag+": "+l.t+"  =>  "+(d.e||"(no rewrite written)")+(d.n?"  // "+d.n:""));
    });
  });
  out[0]+=" ("+Dn+" of "+T+" lines decided)";
  return out.join("\n");
}
document.getElementById("export").onclick=()=>{document.getElementById("out").value=exportText();document.getElementById("dlg").showModal()};
document.getElementById("close").onclick=()=>document.getElementById("dlg").close();
document.getElementById("copy").onclick=async()=>{
  const ta=document.getElementById("out");ta.select();
  try{await navigator.clipboard.writeText(ta.value);document.getElementById("copy").textContent="Copied"}
  catch(e){document.getElementById("copy").textContent="Press Ctrl+C"}
  setTimeout(()=>document.getElementById("copy").textContent="Copy",1800);
};
// load: this browser first, then the shared copy if the db is there
try{const s=localStorage.getItem(KEY);if(s)D=JSON.parse(s)||{}}catch(e){}
renderNav();renderMain();setSave("Saved in this browser only");
(async()=>{
  try{
    db=await claude.use("db");if(!db)return;
    doc=db.doc("audit/decisions");
    const snap=await Promise.race([doc.get(),new Promise((_,r)=>setTimeout(()=>r(),10000))]);
    const v=snap&&(snap.exists===undefined||snap.exists)&&(typeof snap.data==="function"?snap.data():snap);
    if(v&&v.d&&Object.keys(v.d).length>=Object.keys(D).length){D=v.d;renderNav();renderMain()}
    else if(Object.keys(D).length){persist()}
    setSave("Saved");
  }catch(e){doc=null;setSave("Saved in this browser only")}
})();
</script>
