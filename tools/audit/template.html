<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cro_x Pool Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: pool list on the left with progress, one shuffled pool at a time on the right. Ember red on parchment/charcoal. */
:root{--bg:#f3ede0;--panel:#fbf7ee;--ink:#2a2118;--mute:#6f6354;--line:#d9ceb8;--accent:#a3201a;--accent-ink:#fff;--keep:#2f6b3a;--cut:#8a2a22;--edit:#8a6414;--chip:#ebe2cf;
--display:'Cinzel',Georgia,serif;--body:'IBM Plex Sans',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--panel:#201a14;--ink:#eadfca;--mute:#a09280;--line:#3a3025;--accent:#d8473b;--accent-ink:#17130f;--keep:#7cc48a;--cut:#e0786d;--edit:#e0b254;--chip:#2c241b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130f;--panel:#201a14;--ink:#eadfca;--mute:#a09280;--line:#3a3025;--accent:#d8473b;--accent-ink:#17130f;--keep:#7cc48a;--cut:#e0786d;--edit:#e0b254;--chip:#2c241b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
button,input,textarea,select{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
h1{font:600 20px var(--display);letter-spacing:.04em;margin:0}
.total{display:flex;align-items:center;gap:10px;color:var(--mute);font-variant-numeric:tabular-nums}
.bar{width:160px;height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{display:grid;grid-template-columns:300px 1fr;gap:0;align-items:start}
nav{border-right:1px solid var(--line);padding:12px 8px 40px;position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto}
nav h2{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:14px 10px 4px}
nav button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:14px}
nav button:hover{background:var(--chip)}
nav button[aria-current="true"]{background:var(--chip);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
nav .n{color:var(--mute);font-variant-numeric:tabular-nums}
nav .done .n{color:var(--keep)}
main{padding:20px 24px 80px;max-width:820px}
.crumb{color:var(--mute);font-size:13px;margin-bottom:2px}
h3{font:600 22px var(--display);margin:0 0 6px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 10px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.help{color:var(--mute);font-size:13px}
.line{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:10px 14px;margin:0 0 8px}
.line.k{border-left-color:var(--keep)}.line.x{border-left-color:var(--cut)}.line.e{border-left-color:var(--edit)}
.line.cur{box-shadow:0 0 0 2px var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-start}
.txt{flex:1 1 300px;font-size:16px;overflow-wrap:anywhere}
.txt.emote{font-style:italic}
.txt.cut{text-decoration:line-through;color:var(--mute)}
.acts{display:flex;gap:6px}
.acts button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 10px;cursor:pointer;min-width:64px}
.acts button[aria-pressed="true"].k{background:var(--keep);color:var(--bg);border-color:var(--keep)}
.acts button[aria-pressed="true"].x{background:var(--cut);color:var(--bg);border-color:var(--cut)}
.acts button[aria-pressed="true"].e{background:var(--edit);color:var(--bg);border-color:var(--edit)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--mute)}
.chip.t{color:var(--accent);font-weight:600}
.rate{font-variant-numeric:tabular-nums}
textarea.rw{width:100%;margin-top:8px;min-height:54px;padding:8px;border:1px solid var(--edit);border-radius:6px;background:var(--bg)}
.note{width:100%;margin-top:8px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.empty{color:var(--mute);padding:30px 0}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);width:min(760px,92vw);padding:18px}
dialog textarea{width:100%;height:50vh;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace}
dialog::backdrop{background:rgba(0,0,0,.5)}
.status{font-size:13px;color:var(--mute)}
@media (max-width:760px){.wrap{grid-template-columns:1fr}nav{position:static;height:auto;max-height:220px;border-right:0;border-bottom:1px solid var(--line)}main{padding:16px}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s}}
</style>
</head>
<body>
<header>
  <h1>cro_x Pool Audit</h1>
  <div class="total"><div class="bar" aria-hidden="true"><i id="gbar" style="width:0"></i></div><span id="gtxt"></span></div>
  <span class="status" id="save">Loading saved choices...</span>
  <div class="spacer"></div>
  <button class="btn" id="theme" type="button">Theme</button>
  <button class="btn primary" id="export" type="button">Export choices</button>
</header>
<div class="wrap">
  <nav id="nav" aria-label="Pools"></nav>
  <main id="main"></main>
</div>
<dialog id="dlg">
  <p class="help" style="margin-top:0">Copy this and paste it into the chat. It lists, for every pool, what you kept, cut and rewrote.</p>
  <textarea id="out" readonly aria-label="Exported choices"></textarea>
  <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end">
    <button class="btn primary" id="copy" type="button">Copy</button>
    <button class="btn" id="close" type="button">Close</button>
  </div>
</dialog>
<script>
const POOLS = /*DATA*/;
const KEY = "croxAudit1";
let D = {}, cur = POOLS[0].id, filter = "all", focus = 0, db = null, doc = null, saveTimer = null;

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function shuffled(p){ // stable shuffle per pool so the order never changes between visits
  const idx=p.lines.map((_,i)=>i); let s=hash(p.id)||1;
  for(let i=idx.length-1;i>0;i--){s=Math.imul(s,1664525)+1013904223>>>0;const j=s%(i+1);[idx[i],idx[j]]=[idx[j],idx[i]]}
  return idx;
}
POOLS.forEach(p=>p.order=shuffled(p));
const byId=Object.fromEntries(POOLS.map(p=>[p.id,p]));
const keyOf=(pid,i)=>pid+"|"+i;
function stat(p){let k=0,x=0,e=0;p.lines.forEach((_,i)=>{const d=D[keyOf(p.id,i)];if(d){if(d.s==="k")k++;else if(d.s==="x")x++;else if(d.s==="e")e++}});return {k,x,e,done:k+x+e,n:p.lines.length}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    if(doc){try{await doc.set({d:D,t:Date.now()});setSave("Saved")}catch(e){setSave("Saved in this browser only")}}
    else setSave("Saved in this browser only");
  },600);
}
function setSave(t){document.getElementById("save").textContent=t}

function renderNav(){
  const nav=document.getElementById("nav");let html="",g="";
  POOLS.forEach(p=>{
    if(p.group!==g){g=p.group;html+=`<h2>${esc(g)}</h2>`}
    const s=stat(p);
    html+=`<button type="button" data-id="${esc(p.id)}" class="${s.done===s.n?"done":""}" ${p.id===cur?'aria-current="true"':""}><span>${esc(p.name)}</span><span class="n">${s.done}/${s.n}</span></button>`;
  });
  nav.innerHTML=html;
  let T=0,Dn=0;POOLS.forEach(p=>{const s=stat(p);T+=s.n;Dn+=s.done});
  document.getElementById("gbar").style.width=(100*Dn/T)+"%";
  document.getElementById("gtxt").textContent=`${Dn} of ${T} lines decided`;
}
function chips(l){
  let c="";
  if(l.o)c+=`<span class="chip t">${esc(l.o)} only</span>`;
  if(l.e)c+=`<span class="chip">emote</span>`;
  if(l.r)c+=`<span class="chip rate" title="Darkness, 1 light to 5 dark">dark ${l.r}/5</span>`;
  if(l.a)c+=`<span class="chip">fits: ${esc(l.a.join(", "))}</span>`;
  if(l.m)c+=`<span class="chip">needs: ${esc(l.m.join(", "))}</span>`;
  if(l.c)c+=`<span class="chip">clean: ${esc(l.c)}</span>`;
  return c;
}
function renderMain(){
  const p=byId[cur],m=document.getElementById("main"),s=stat(p);
  const items=p.order.filter(i=>{const d=D[keyOf(p.id,i)];const st=d?d.s:"";return filter==="all"||(filter==="u"&&!st)||filter===st});
  if(focus>=items.length)focus=Math.max(0,items.length-1);
  let h=`<div class="crumb">${esc(p.group)}</div><h3>${esc(p.name)}</h3>
  <div class="help">${s.n} lines, shuffled. Kept ${s.k}, cut ${s.x}, rewrite ${s.e}, undecided ${s.n-s.done}.</div>
  <div class="tools"><div class="seg" role="group" aria-label="Filter">
    ${[["all","All"],["u","Undecided"],["k","Kept"],["x","Cut"],["e","Rewrite"]].map(([v,t])=>`<button type="button" data-f="${v}" aria-pressed="${filter===v}">${t}</button>`).join("")}
  </div><span class="help">Keys: K keep, X cut, E rewrite, arrows to move.</span></div>`;
  if(!items.length)h+=`<div class="empty">Nothing here with this filter.</div>`;
  items.forEach((i,n)=>{
    const l=p.lines[i],d=D[keyOf(p.id,i)]||{},st=d.s||"";
    h+=`<div class="line ${st} ${n===focus?"cur":""}" data-i="${i}" data-n="${n}">
      <div class="row"><div class="txt ${l.e?"emote":""} ${st==="x"?"cut":""}">${esc(l.t)}</div>
      <div class="acts">
        <button type="button" class="k" data-a="k" aria-pressed="${st==="k"}">Keep</button>
        <button type="button" class="x" data-a="x" aria-pressed="${st==="x"}">Cut</button>
        <button type="button" class="e" data-a="e" aria-pressed="${st==="e"}">Rewrite</button>
      </div></div>
      <div class="chips">${chips(l)}</div>
      ${st==="e"?`<textarea class="rw" id="rw-${i}" aria-label="Your rewrite" placeholder="Write your version here">${esc(d.e||"")}</textarea>`:""}
      ${st?`<input class="note" id="nt-${i}" aria-label="Note" placeholder="Optional note (why)" value="${esc(d.n||"")}">`:""}
    </div>`;
  });
  m.innerHTML=h;
}
function setDecision(i,a){
  const k=keyOf(cur,i),d=D[k];
  if(d&&d.s===a){delete D[k]}else{D[k]=Object.assign({},d,{s:a})}
  persist();renderNav();renderMain();
}
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-id]");if(!b)return;cur=b.dataset.id;focus=0;renderNav();renderMain();window.scrollTo(0,0)});
document.getElementById("main").addEventListener("click",e=>{
  const f=e.target.closest("button[data-f]");if(f){filter=f.dataset.f;focus=0;renderMain();return}
  const a=e.target.closest("button[data-a]");if(a){const row=a.closest(".line");focus=+row.dataset.n;setDecision(+row.dataset.i,a.dataset.a)}
});
document.getElementById("main").addEventListener("input",e=>{
  const row=e.target.closest(".line");if(!row)return;const k=keyOf(cur,+row.dataset.i);if(!D[k])return;
  if(e.target.classList.contains("rw"))D[k].e=e.target.value;else if(e.target.classList.contains("note"))D[k].n=e.target.value;
  persist();
});
document.addEventListener("keydown",e=>{
  const t=e.target.tagName;if(t==="TEXTAREA"||t==="INPUT"||e.metaKey||e.ctrlKey||e.altKey)return;
  const rows=[...document.querySelectorAll("#main .line")];if(!rows.length)return;
  const key=e.key.toLowerCase();
  if(key==="arrowdown"||key==="j"){focus=Math.min(rows.length-1,focus+1)}
  else if(key==="arrowup"){focus=Math.max(0,focus-1)}
  else if(["k","x","e"].includes(key)){const r=rows[focus];if(r){const wasFocus=focus;setDecision(+r.dataset.i,key);
      if(key!=="e"&&filter==="all")focus=Math.min(wasFocus+1,rows.length-1);renderMain();const c=document.querySelector("#main .line.cur");if(c)c.scrollIntoView({block:"center"});
      if(key==="e"){const rw=document.getElementById("rw-"+r.dataset.i);if(rw)rw.focus()}}return}
  else return;
  e.preventDefault();renderMain();const c=document.querySelector("#main .line.cur");if(c)c.scrollIntoView({block:"center"});
});
document.getElementById("theme").onclick=()=>{
  const r=document.documentElement,dark=(r.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"))==="dark";
  r.dataset.theme=dark?"light":"dark";
};
function exportText(){
  const out=["cro_x pool audit choices"];let T=0,Dn=0;
  POOLS.forEach(p=>{
    const s=stat(p);T+=s.n;Dn+=s.done;if(!s.done)return;
    out.push("","## "+p.group+" / "+p.name+" (kept "+s.k+", cut "+s.x+", rewrite "+s.e+", undecided "+(s.n-s.done)+")");
    p.lines.forEach((l,i)=>{const d=D[keyOf(p.id,i)];if(!d)return;
      const tag=l.o?" ["+l.o+"]":"";
      if(d.s==="k")out.push("KEEP"+tag+": "+l.t+(d.n?"  // "+d.n:""));
      else if(d.s==="x")out.push("CUT"+tag+": "+l.t+(d.n?"  // "+d.n:""));
      else out.push("REWRITE"+tag+": "+l.t+"  =>  "+(d.e||"(no rewrite written)")+(d.n?"  // "+d.n:""));
    });
  });
  out[0]+=" ("+Dn+" of "+T+" lines decided)";
  return out.join("\n");
}
document.getElementById("export").onclick=()=>{document.getElementById("out").value=exportText();document.getElementById("dlg").showModal()};
document.getElementById("close").onclick=()=>document.getElementById("dlg").close();
document.getElementById("copy").onclick=async()=>{
  const ta=document.getElementById("out");ta.select();
  try{await navigator.clipboard.writeText(ta.value);document.getElementById("copy").textContent="Copied"}
  catch(e){document.getElementById("copy").textContent="Press Ctrl+C"}
  setTimeout(()=>document.getElementById("copy").textContent="Copy",1800);
};
// load: this browser first, then the shared copy if the db is there
try{const s=localStorage.getItem(KEY);if(s)D=JSON.parse(s)||{}}catch(e){}
renderNav();renderMain();setSave("Saved in this browser only");
(async()=>{
  try{
    db=await claude.use("db");if(!db)return;
    doc=db.doc("audit/decisions");
    const snap=await Promise.race([doc.get(),new Promise((_,r)=>setTimeout(()=>r(),10000))]);
    const v=snap&&(snap.exists===undefined||snap.exists)&&(typeof snap.data==="function"?snap.data():snap);
    if(v&&v.d&&Object.keys(v.d).length>=Object.keys(D).length){D=v.d;renderNav();renderMain()}
    else if(Object.keys(D).length){persist()}
    setSave("Saved");
  }catch(e){doc=null;setSave("Saved in this browser only")}
})();
</script>
</body>
</html>
