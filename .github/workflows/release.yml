name: Release

# Every push to main: read the version from CROX.toc. If there is no release for it yet,
# zip the CROX folder and publish a pre-release named v<version> with the zip attached.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: |
          v=$(grep -m1 '^## Version:' CROX/CROX.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Skip if this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build the zip
        if: steps.exists.outputs.found == 'false'
        run: zip -r "cro-x_v${{ steps.ver.outputs.version }}_alpha2.zip" CROX
      - name: Publish the release
        if: steps.exists.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" "cro-x_v${{ steps.ver.outputs.version }}_alpha2.zip" \
            --title "cro/x v${{ steps.ver.outputs.version }} alpha 2" \
            --prerelease \
            --notes "Install: close the game, delete the old Interface/AddOns/CROX folder, unzip so the path is Interface/AddOns/CROX/CROX.toc. Report problems in game with /x bug. Tester checklist: docs/beta/Tester checklist.md"
